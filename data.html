<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data</title>
    <link rel="stylesheet" href="site.css">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.querySelector('nav').innerHTML = data;
                })
                .catch(error => console.error('Error loading navbar:', error));
        });
    </script>
</head>
<body>
    <header class="site-header"><div class="header-inner"><div class="brand-line"><p class="brand">zach's space<span class="brand-dot">.</span></p></div><p class="status-line"><span class="status-dot"></span> studying stars, writing code, drinking coffee</p></div></header>
    <nav></nav>
    <div id="content">
        <h1>Data</h1>
        <p>Welcome to the Data page. Here you can find datasets and related resources.</p>
    </div>
    <script src="site.js" defer></script>
</body>
</html>
