<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        nav .dropdown {
            float: left;
            overflow: hidden;
        }

        nav .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            color: white;
            padding: 14px 16px;
            background-color: inherit;
            font-family: inherit;
            margin: 0;
        }

        nav .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            margin-top: 46px;
        }

        nav .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        nav .dropdown-content a:hover {
            background-color: #ddd;
        }

        nav .dropdown:hover .dropdown-content {
            display: block;
        }

        #content {
            padding: 20px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.querySelector('nav').innerHTML = data;
                })
                .catch(error => console.error('Error loading navbar:', error));
        });
    </script>
</head>
<body>
    <nav></nav>
    <div id="content">
        <h1>Publications</h1>
        <p>Welcome to the Publications page. Here you can find a list of my published works.</p>
    </div>
</body>
</html>
