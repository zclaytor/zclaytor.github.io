<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        #content {
            padding: 20px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.querySelector('nav').innerHTML = data;
                })
                .catch(error => console.error('Error loading navbar:', error));
        });
    </script>
</head>
<body>
    <nav></nav>
    <div id="content">
        <h1>Software</h1>
        <p>Welcome to the Software page. Here you can find information about the software I have developed.</p>
    </div>
</body>
</html>
